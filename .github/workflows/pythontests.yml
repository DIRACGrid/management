name: Python tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r dirac-distribution/requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test the HS23 table generator
      run: |
        pip install pytest requests
        pytest hs23-table/test_generate_hs23_table.py
    - name: Lint with pylint
      run: |
        pip install pylint
        pylint -E --msg-template="{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}" dirac-install.py hs23-table/generate_hs23_table.py
